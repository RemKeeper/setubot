name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.26.2"

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: windows
            goarch: arm64
            archive: zip
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test
        run: go test ./...

      - name: Build and package
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist/package

          binary="setubot"
          if [ "$GOOS" = "windows" ]; then
            binary="setubot.exe"
          fi

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "dist/package/${binary}" \
            .

          cp README.md config.example.json dist/package/

          package="setubot-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (
              cd dist/package
              zip -q -r "../${package}.zip" .
            )
          else
            tar -C dist/package -czf "dist/${package}.tar.gz" .
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: setubot-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/setubot-*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum setubot-* > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/setubot-*
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
